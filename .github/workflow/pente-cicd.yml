name: CI/CD Pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPO: simple-microservice
      TF_WORKSPACE: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Run lint
        run: flake8 app/

      - name: Run unit tests
        run: pytest app/

      - name: Terraform fmt & validate
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        run: |
          IMAGE_URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Terraform apply non-prod
        run: |
          cd terraform
          terraform workspace new $TF_WORKSPACE || terraform workspace select $TF_WORKSPACE
          terraform init
          terraform apply -auto-approve -var="image_tag=${GITHUB_SHA}"

      - name: Deploy with Helm
        run: |
          helm upgrade --install my-microservice-pente ./helm/my-microservice-pente \
            --set image.repository=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }} \
            --set image.tag=${GITHUB_SHA}
